version: '3.12'

services:
  db:
    build:
      context: .
      dockerfile: postgres-custom.dockerfile
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: test
      POSTGRES_DB: olms_geo
    ports:
      - "6000:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U geo -d olms_geo']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  dictionary-microservice:
    build:
      context: .
      dockerfile: VKR_landscape_design/Dockerfile
    container_name: dictionary-microservice
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Landscape GIS API"
      APP_HOST: "0.0.0.0"
      APP_PORT: 8000
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: olms_geo
      DB_USER: geo
      DB_PASSWORD: test
      CORS_ORIGINS: "http://localhost:3000,http://localhost"

  user-microservice:
    build:
      context: .
      dockerfile: user-microservice/Dockerfile
    container_name: user-microservice
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8010"
    environment:
      APP_NAME: "Landscape Users API"
      APP_HOST: "0.0.0.0"
      APP_PORT: 8010
      APP_DEBUG: "true"
      JWT_PRIVATE_KEY_PATH: /user-microservice/keys/private_key.pem
      JWT_PUBLIC_KEY_PATH: /user-microservice/keys/public_key.pem
      JWT_ALGORITHM: RS256
      JWT_ISSUER: user-microservice
      JWT_AUDIENCE: internal-services
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: olms_people
      DB_USER: olms_people_keeper
      DB_PASSWORD: 5uthU]evx2RYV-2B].hMsH=aU>ia-2!9
      CORS_ORIGINS: "http://localhost:3000,http://localhost"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: olms_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: OLMS_USER
      MINIO_ROOT_PASSWORD: OLMS_PASSWORD
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: olms_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 OLMS_USER OLMS_PASSWORD;
      mc mb --ignore-existing local/olms-files;
      mc anonymous set none local/olms-files;
      exit 0;
      "

  ml-microservice:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    container_name: ml-microservice
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8030:8030"
    environment:
      APP_NAME: "Landscape GIS ML Service"
      APP_HOST: "0.0.0.0"
      APP_PORT: 8030
      APP_DEBUG: "true"
      DEBUG_LEVEL: "info"
      GATEWAY_URL: "http://gateway:8080"
      DICTIONARY_MICROSERVICE_BASE_URL: "http://dictionary-microservice:8000"
      REQUEST_TIMEOUT_SECONDS: 120
      DICTIONARY_MICROSERVICE_TIMEOUT: 120
      TRAINING_DATABASE_URL: "postgresql+psycopg://geo:test@db:6000/olms_geo"
      DATABASE_URL: "postgresql+psycopg://olms_ml_keeper:bvUO-XEWnwgdH.)yt:qy#zS[{ljo8G3s@db:5432/olms_ml"
      DATABASE_USER: "olms_ml_keeper"
      DATABASE_PASSWORD: "bvUO-XEWnwgdH.)yt:qy#zS[{ljo8G3s"
      MODEL_MINIO_ROOT_DIR: "ml_service/models"
      MODEL_CURRENT_VERSION: "default"
      MODEL_LOCAL_TMP_DIR: "/tmp/olms-ml-service"
      CATBOOST_TRAIN_DIR: "/tmp/olms-ml-service/catboost_info"
      MODEL_FAIL_FAST_ON_STARTUP: "false"
      CORS_ORIGINS: "http://localhost:3000,http://localhost"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "OLMS_USER"
      MINIO_SECRET_KEY: "OLMS_PASSWORD"
      MINIO_BUCKET_NAME: "olms-files"
      MINIO_AUTO_CREATE_BUCKET: "true"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_NAME: "Landscape GIS Gateway"
      APP_HOST: "0.0.0.0"
      APP_PORT: 8080
      APP_DEBUG: "true"
      USERS_SERVICE_URL: "http://user-microservice:8010"
      DICTIONARY_SERVICE_URL: "http://dictionary-microservice:8000"
      ML_SERVICE_URL: "http://ml-microservice:8030"
      REQUEST_TIMEOUT_SECONDS: 120
      CORS_ORIGINS: "http://localhost:3000,http://localhost"

  frontend:
    build:
      context: VKR_landscape_react_front
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: "http://gateway:8080"
    container_name: frontend
    depends_on:
      - gateway
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_BASE_URL: "http://gateway:8080"

volumes:
  minio_data:
