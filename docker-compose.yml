version: '3.12'

services:
  db:
    build:
      context: .
      dockerfile: postgres-custom.dockerfile
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: test
      POSTGRES_DB: olms_geo
    ports:
      - "6000:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U geo -d olms_geo']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
#    Для локального запуска, чтобы БД оставалась в том же состоянии
#    volumes:
#      - postgres_data:/var/lib/postgresql/data

